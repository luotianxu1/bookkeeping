server:
  port: 8083

spring:
  application:
    name: tool-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 需要与 auth-service 保持一致，用于校验登录令牌
    secret: "${JWT_SECRET}"

knife4j:
  enable: true
  # 生产环境设置环境变量 KNIFE4J_PRODUCTION=true 关闭在线文档
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn
