server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 至少 32 字节
    secret: "${JWT_SECRET}"
    expiration-seconds: 604800

knife4j:
  enable: true
  # 生产环境设置环境变量 KNIFE4J_PRODUCTION=true 关闭在线文档
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn
