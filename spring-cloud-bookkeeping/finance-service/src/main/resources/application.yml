server:
  port: 8082

spring:
  application:
    name: finance-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 需要与 auth-service 保持一致，用于校验登录令牌
    secret: "change-this-to-a-long-secret-key-at-least-32-bytes"

knife4j:
  enable: true
  setting:
    language: zh_cn

finance:
  market-status:
    index-api-url: https://push2delay.eastmoney.com/api/qt/ulist.np/get
  limit-up-down:
    stock-list-api-url: https://push2delay.eastmoney.com/api/qt/clist/get
  stock-screener:
    # 沪深北交易日收盘后执行；公开行情源通常在16点前完成日K更新。
    cron: 0 10 16 * * MON-FRI
    fetch-concurrency: 12
    connect-timeout-millis: 3000
    read-timeout-millis: 5000
    stock-list-api-url: https://push2delay.eastmoney.com/api/qt/clist/get
    daily-kline-api-url: https://quotes.sina.cn/cn/api/jsonp_v2.php
  asset-snapshot:
    cron: 0 0 0 * * *
    retry-cron: 0 10 0 * * *
  salary:
    settlement:
      cron: 0 10 8 * * *
  gold-price:
    refresh-interval-millis: 300000
    retry-delay-millis: 10000
    max-retry-attempts: 3
  investment:
    auto-invest:
      cron: 0 5 9 * * *
    profit-sync:
      cron: 0 30 21 * * *
    trade-settlement:
      cron: 0 6 9 * * *
    market-closed-dates: >-
      2025-01-01,2025-01-28,2025-01-29,2025-01-30,2025-01-31,2025-02-01,2025-02-02,2025-02-03,2025-02-04,2025-04-04,2025-04-05,2025-04-06,2025-05-01,2025-05-02,2025-05-03,2025-05-04,2025-05-05,2025-05-31,2025-06-01,2025-06-02,2025-10-01,2025-10-02,2025-10-03,2025-10-04,2025-10-05,2025-10-06,2025-10-07,2025-10-08,2026-01-01,2026-01-02,2026-01-03,2026-02-15,2026-02-16,2026-02-17,2026-02-18,2026-02-19,2026-02-20,2026-02-21,2026-02-22,2026-02-23,2026-04-04,2026-04-05,2026-04-06,2026-05-01,2026-05-02,2026-05-03,2026-05-04,2026-05-05,2026-06-19,2026-06-20,2026-06-21,2026-09-25,2026-09-26,2026-09-27,2026-10-01,2026-10-02,2026-10-03,2026-10-04,2026-10-05,2026-10-06,2026-10-07
