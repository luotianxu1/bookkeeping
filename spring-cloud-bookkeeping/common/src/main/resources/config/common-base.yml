# 各微服务共享的基础配置。
# 由各服务 application.yml 通过 spring.config.import: classpath:config/common-base.yml 引入；
# 服务本地 application.yml 的同名配置优先级更高，可按需覆盖。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 需与 auth-service 签发端保持一致，至少 32 字节
    secret: "${JWT_SECRET}"

knife4j:
  enable: true
  # 生产环境设置环境变量 KNIFE4J_PRODUCTION=true 关闭在线文档
  production: ${KNIFE4J_PRODUCTION:false}
  setting:
    language: zh_cn
