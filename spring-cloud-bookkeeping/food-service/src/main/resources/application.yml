server:
  port: 8084

spring:
  application:
    name: food-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookkeeping_app?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 需要与 auth-service 保持一致，用于校验登录令牌
    secret: "${JWT_SECRET:change-this-to-a-long-secret-key-at-least-32-bytes}"

knife4j:
  enable: true
  setting:
    language: zh_cn
